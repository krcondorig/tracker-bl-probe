name: Maritime Tracking Scraper

# 13:00 UTC = 08:00 en Lima (PET, UTC-5, sin horario de verano).
# El runner de GitHub puede retrasar el cron hasta ~15 min en horas punta.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      containers:
        description: "Contenedores separados por comas. Vacío = pedirlos al backend (/pendientes)."
        required: false
        default: ""
        type: string
      carriers:
        description: "Navieras a consultar (CSV)."
        required: false
        default: "MSC,MAERSK,HAPAG_LLOYD"
        type: string
      max_containers:
        description: "Tope de contenedores por ejecución."
        required: false
        default: "40"
        type: string
      dry_run:
        description: "Extraer pero no enviar el POST al backend."
        required: false
        default: false
        type: boolean
      use_warp:
        description: "Conectar Cloudflare WARP (SOCKS5 :40000). Desactivar solo para depurar."
        required: false
        default: true
        type: boolean

# Evita dos ejecuciones solapadas: un scraper concurrente duplica carga sobre
# los sistemas anti-bot y dispara los bloqueos por IP.
concurrency:
  group: maritime-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: Extract tracking
    # Ubuntu 26.04 (nuevo `ubuntu-latest`) no provee `libtss2-tctildr0t64`,
    # dependencia de cloudflare-warp, y la instalación falla. 24.04 sí.
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      SCRAPER_LOG_LEVEL: "INFO"
      SPRING_WEBHOOK_URL: ${{ secrets.SPRING_WEBHOOK_URL }}
      SPRING_API_TOKEN: ${{ secrets.SPRING_API_TOKEN }}
      SCRAPER_TRIGGER: ${{ github.event_name }}
      SCRAPER_CONTAINERS: ${{ github.event.inputs.containers || '' }}
      SCRAPER_CARRIERS: ${{ github.event.inputs.carriers || 'MSC,MAERSK,HAPAG_LLOYD' }}
      SCRAPER_MAX_CONTAINERS: ${{ github.event.inputs.max_containers || '40' }}
      SCRAPER_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      SCRAPER_DELAY_MIN: "6"
      SCRAPER_DELAY_MAX: "12"
      SCRAPER_WAIT_SECONDS: "25"
      SCRAPER_MAX_ATTEMPTS: "2"
      SCRAPER_NAV_TIMEOUT_MS: "60000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # Dependencias de sistema: motor gráfico virtual + librerías de Firefox
      # ------------------------------------------------------------------ #
      - name: Install system dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          t0=$(date +%s)
          mark() { echo "[tiempo] $1: $(( $(date +%s) - t0 ))s"; }
          sudo apt-get update -qq
          mark "apt-get update"
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb dbus-x11 libgtk-3-0 libdbus-glib-1-2 libx11-xcb1 \
            libxtst6 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libatk1.0-0 libatk-bridge2.0-0 \
            libasound2t64 libnss3 libnspr4 fonts-liberation fonts-noto-color-emoji \
            2>/dev/null || sudo apt-get install -y -qq --no-install-recommends \
            xvfb dbus-x11 libgtk-3-0 libdbus-glib-1-2 libx11-xcb1 \
            libxtst6 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libatk1.0-0 libatk-bridge2.0-0 \
            libasound2 libnss3 libnspr4 fonts-liberation
          mark "apt-get install"
          echo "xvfb: $(xvfb-run --help >/dev/null 2>&1 && echo ok || echo missing)"

      # ------------------------------------------------------------------ #
      # Cloudflare WARP en modo proxy -> SOCKS5 local en 127.0.0.1:40000
      # Sin esto, la IP del runner (Azure) está en listas negativas de Akamai
      # y de Cloudflare y el primer GET recibe un 403/challenge.
      # ------------------------------------------------------------------ #
      - name: Cache WARP .deb packages
        if: ${{ github.event_name == 'schedule' || github.event.inputs.use_warp != 'false' }}
        uses: actions/cache@v4
        with:
          # Medido: de ~880s de instalación, ~820s son descargar los 130 .deb
          # que arrastran las dependencias de WARP; `dpkg` solo tarda ~59s.
          # Con el cache en disco, la instalación baja a ~18s.
          path: ~/.warp-debs
          key: warp-debs-${{ runner.os }}-v1

      - name: Install Cloudflare WARP
        if: ${{ github.event_name == 'schedule' || github.event.inputs.use_warp != 'false' }}
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ ${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          # Update completo: la dependencia libtss2-tctildr0t64 está en el
          # pocket `security`, que un update parcial no refresca.
          sudo apt-get update -qq

          # Si el cache trae los .deb, se instalan desde disco: ni red ni espera.
          CACHE_DEBS="$HOME/.warp-debs"
          mkdir -p "$CACHE_DEBS"
          if compgen -G "$CACHE_DEBS/*.deb" > /dev/null; then
            echo "Instalando $(ls -1 "$CACHE_DEBS"/*.deb | wc -l) .deb desde el cache"
            # dpkg es puramente local. `apt-get install <rutas .deb>` seguia
            # tardando ~250s en el workflow de produccion porque resuelve
            # dependencias contra los indices; dpkg no consulta nada.
            sudo dpkg -i "$CACHE_DEBS"/*.deb >/dev/null 2>&1 \
              || sudo apt-get install -y -qq --no-install-recommends -f || true
          fi

          if ! sudo apt-get install -y -qq --no-install-recommends \
               -o Acquire::Retries=3 cloudflare-warp; then
            echo "::warning::cloudflare-warp no instaló a la primera; se inspecciona la dependencia."
            apt-cache policy libtss2-tctildr0t64 || true
            sudo apt-get install -y -qq --no-install-recommends libtss2-tctildr0t64 \
              || sudo apt-get install -y -qq --no-install-recommends libtss2-tctildr0 \
              || true
            sudo apt-get install -y -qq --no-install-recommends -f cloudflare-warp
          fi

          # Guardar los .deb para la próxima ejecución y así no volver a
          # descargar 123 MB en cada corrida.
          if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
            cp -n /var/cache/apt/archives/*.deb "$CACHE_DEBS/" 2>/dev/null || true
            echo "(.deb en cache: $(ls -1 "$CACHE_DEBS"/*.deb | wc -l), $(du -sh "$CACHE_DEBS" | cut -f1))"
          fi

          warp-cli --version

      - name: Connect WARP through SOCKS5 proxy
        if: ${{ github.event_name == 'schedule' || github.event.inputs.use_warp != 'false' }}
        run: |
          set -euo pipefail

          # warp-svc corre como servicio; si la imagen no tiene systemd activo,
          # se levanta en segundo plano.
          if ! sudo systemctl enable --now warp-svc 2>/dev/null; then
            sudo nohup warp-svc >/tmp/warp-svc.log 2>&1 &
          fi
          for i in $(seq 1 30); do
            if warp-cli --accept-tos status >/dev/null 2>&1; then break; fi
            sleep 1
          done

          # Registro: si ya existe uno (imagen pre-horneada) se reutiliza.
          if ! warp-cli --accept-tos registration show >/dev/null 2>&1; then
            warp-cli --accept-tos registration new
          fi

          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect

          for i in $(seq 1 40); do
            STATE="$(warp-cli --accept-tos status 2>/dev/null || echo unknown)"
            echo "warp status: ${STATE}"
            case "$STATE" in
              *Connected*|*"Proxy"*) break ;;
            esac
            sleep 2
          done

      - name: Verify egress IP through proxy
        if: ${{ github.event_name == 'schedule' || github.event.inputs.use_warp != 'false' }}
        run: |
          set -euo pipefail
          DIRECT_IP="$(curl -s --max-time 15 https://api.ipify.org || echo unreachable)"
          PROXY_IP="$(curl -s --max-time 25 --socks5-hostname 127.0.0.1:40000 https://api.ipify.org || echo unreachable)"
          echo "IP directa del runner : ${DIRECT_IP}"
          echo "IP a través de WARP   : ${PROXY_IP}"
          {
            echo "### Salida de red"
            echo ""
            echo "| Ruta | IP |"
            echo "| --- | --- |"
            echo "| Runner | \`${DIRECT_IP}\` |"
            echo "| WARP SOCKS5 | \`${PROXY_IP}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${PROXY_IP}" = "unreachable" ]; then
            echo "::error::El proxy SOCKS5 no responde: sin él las tres navieras devolverán challenge."
            exit 1
          fi
          if [ "${DIRECT_IP}" = "${PROXY_IP}" ]; then
            echo "::warning::La IP de salida es idéntica a la directa; WARP podría no estar enrutando."
          fi

      # ------------------------------------------------------------------ #
      # Python + Camoufox
      # ------------------------------------------------------------------ #
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # El binario de Camoufox pesa ~1,3 GB. Sin caché, cada ejecución diaria
      # gastaría varios minutos descargándolo desde GitHub Releases.
      - name: Cache Camoufox browser
        id: camoufox-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            camoufox-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Camoufox browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Sin token, `camoufox fetch` choca con el rate limit de
          # api.github.com, que los runners comparten por IP.
          python scripts/ensure_camoufox.py
          echo "camoufox dir: $(python -m camoufox path)"

      - name: Show Camoufox version
        run: python -m camoufox version || true

      # ------------------------------------------------------------------ #
      # Ejecución
      # ------------------------------------------------------------------ #
      - name: Run scraper
        id: run
        env:
          USE_WARP: ${{ github.event.inputs.use_warp || 'true' }}
        run: |
          set -euo pipefail
          # El proxy es opt-in explícito: si se pidió no usarlo, se vacía para
          # que Camoufox salga directo (útil al depurar el workflow).
          if [ "${USE_WARP}" = "false" ]; then
            export SCRAPER_PROXY=""
            echo "::warning::WARP desactivado por entrada del workflow."
          else
            export SCRAPER_PROXY="${SCRAPER_PROXY:-socks5://127.0.0.1:40000}"
          fi
          echo "Proxy en uso: ${SCRAPER_PROXY:-<directo>}"
          if [ -n "${DISPLAY:-}" ]; then
            echo "DISPLAY ya definido: ${DISPLAY}"
            python scraper.py --output resultados.json
          else
            # headless=False dentro de un X virtual: Camoufox se comporta como un
            # Firefox de escritorio real y evita la huella de "headless Linux".
            xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
              python scraper.py --output resultados.json
          fi

      - name: Upload results artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tracking-results-${{ github.run_id }}
          path: resultados.json
          if-no-files-found: warn
          retention-days: 14

      - name: Show WARP diagnostics on failure
        if: ${{ failure() }}
        run: |
          warp-cli --accept-tos status || true
          warp-cli --accept-tos settings || true
          sudo journalctl -u warp-svc --no-pager -n 60 || true
