name: Probe Hapag endpoint

# Workflow DESECHABLE, de una sola pregunta:
#   Con WARP ya pasamos el challenge de Hapag. ¿Qué petición trae los datos
#   de tracking y con qué forma?
#
# Corre solo la columna WARP porque la directa ya sabemos que devuelve
# Managed Challenge desde Azure.
#
# Sube el dump completo (JSON + diario de red) como artifact, que es donde
# está la respuesta.

on:
  workflow_dispatch:
    inputs:
      bl:
        description: "B/L o booking de Hapag-Lloyd."
        required: false
        default: "HLCUNG12607EKZE0"
        type: string
      wait_seconds:
        description: "Segundos de espera por ruta (3 rutas)."
        required: false
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  probe:
    name: Probe Hapag (warp)
    # 24.04 y no ubuntu-latest: el paquete cloudflare-warp no instala en 26.04
    # (falta libtss2-tctildr0t64) y `ubuntu-latest` ya apunta a 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb dbus-x11 libgtk-3-0 libdbus-glib-1-2 libx11-xcb1 \
            libxtst6 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libatk1.0-0 libatk-bridge2.0-0 \
            libnss3 libnspr4 libasound2t64 fonts-liberation \
            2>/dev/null || sudo apt-get install -y -qq --no-install-recommends \
            xvfb dbus-x11 libgtk-3-0 libdbus-glib-1-2 libx11-xcb1 \
            libxtst6 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libatk1.0-0 libatk-bridge2.0-0 \
            libnss3 libnspr4 libasound2 fonts-liberation

      - name: Install Cloudflare WARP
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ ${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          # Update completo: libtss2-tctildr0t64 vive en el pocket `security` y
          # un update restringido al repo de WARP lo deja sin candidato.
          sudo apt-get update -qq
          if ! sudo apt-get install -y -qq cloudflare-warp; then
            echo "::warning::cloudflare-warp no instaló a la primera; se inspecciona la dependencia."
            apt-cache policy libtss2-tctildr0t64 || true
            sudo apt-get install -y -qq libtss2-tctildr0t64 \
              || sudo apt-get install -y -qq libtss2-tctildr0 \
              || true
            sudo apt-get install -y -qq -f cloudflare-warp
          fi
          warp-cli --version

      - name: Connect WARP through SOCKS5
        run: |
          set -euo pipefail
          if ! sudo systemctl enable --now warp-svc 2>/dev/null; then
            sudo nohup warp-svc >/tmp/warp-svc.log 2>&1 &
          fi
          for i in $(seq 1 30); do
            warp-cli --accept-tos status >/dev/null 2>&1 && break
            sleep 1
          done
          if ! warp-cli --accept-tos registration show >/dev/null 2>&1; then
            warp-cli --accept-tos registration new
          fi
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in $(seq 1 40); do
            STATE="$(warp-cli --accept-tos status 2>/dev/null || echo unknown)"
            echo "warp: ${STATE}"
            case "$STATE" in *Connected*|*Proxy*) break ;; esac
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache Camoufox browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            camoufox-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Camoufox browser
        run: python -m camoufox fetch

      - name: Verify egress goes through WARP
        run: |
          set -euo pipefail
          DIRECT="$(curl -s --max-time 15 https://api.ipify.org || echo unreachable)"
          PROXIED="$(curl -s --max-time 25 --socks5-hostname 127.0.0.1:40000 https://api.ipify.org || echo unreachable)"
          echo "IP directa  : ${DIRECT}"
          echo "IP vía WARP : ${PROXIED}"
          if [ "${PROXIED}" = "unreachable" ]; then
            echo "::error::El proxy SOCKS5 no responde; la prueba no significaría nada."
            exit 1
          fi

      - name: Run Hapag probe
        env:
          BL: ${{ github.event.inputs.bl || 'HLCUNG12607EKZE0' }}
          WAIT: ${{ github.event.inputs.wait_seconds || '30' }}
        run: |
          set -uo pipefail
          # `|| true`: un bloqueo es el DATO, no un error de CI.
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
            python scripts/probe_hapag.py "${BL}" \
              --proxy socks5://127.0.0.1:40000 \
              --wait "${WAIT}" \
              --headed \
              --dump probe-dumps/hapag \
            2>&1 | tee probe-hapag.log || true

          {
            echo "## Probe Hapag (\`${BL}\`)"
            echo ""
            echo '```'
            grep -E "^(RUTA|URL|  HTTP|  title|  BLOQUEADO|  respuestas|  guardados|  diario)" \
              probe-hapag.log || echo "(sin líneas de resumen)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hapag-probe-${{ github.run_id }}
          path: |
            probe-hapag.log
            probe-dumps/hapag/
          if-no-files-found: warn
          retention-days: 7
