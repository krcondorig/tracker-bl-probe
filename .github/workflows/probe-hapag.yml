name: Sonda Hapag (temporal)

# TEMPORAL: mide qué URL/parámetro del listado legacy devuelve filas.
# Se borra en cuanto se elija la variante correcta para tracker/hapag.py.

on:
  workflow_dispatch:

jobs:
  sonda:
    name: Listado Hapag por WARP
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Camoufox
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            camoufox-${{ runner.os }}-

      - name: Asegurar binario de Camoufox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ensure_camoufox.py

      - name: Cache paquetes .deb de WARP
        uses: actions/cache@v4
        with:
          path: ~/.warp-debs
          key: warp-debs-${{ runner.os }}-v1

      - name: Instalar WARP
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ ${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          CACHE_DEBS="$HOME/.warp-debs"
          mkdir -p "$CACHE_DEBS"
          if compgen -G "$CACHE_DEBS/*.deb" > /dev/null; then
            sudo dpkg -i "$CACHE_DEBS"/*.deb >/dev/null 2>&1 \
              || sudo apt-get install -y -qq --no-install-recommends -f || true
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            -o Acquire::Retries=3 cloudflare-warp || {
              sudo apt-get install -y -qq --no-install-recommends -f cloudflare-warp
            }
          if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
            cp -n /var/cache/apt/archives/*.deb "$CACHE_DEBS/" 2>/dev/null || true
          fi

      - name: Conectar WARP
        run: |
          set -euo pipefail
          if ! sudo systemctl enable --now warp-svc 2>/dev/null; then
            sudo nohup warp-svc >/tmp/warp-svc.log 2>&1 &
          fi
          for i in $(seq 1 30); do
            warp-cli --accept-tos status >/dev/null 2>&1 && break
            sleep 1
          done
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in $(seq 1 40); do
            if curl -s -m 5 --socks5 127.0.0.1:40000 https://api.ipify.org >/dev/null 2>&1; then
              echo "WARP listo"; break
            fi
            sleep 2
          done

      - name: Sondar listado
        run: |
          set -o pipefail
          python scripts/probe_hapag_url.py socks5://127.0.0.1:40000 \
            2>&1 | tee probe-url.log || true

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Sonda Hapag"
            echo '```'
            cat probe-url.log || echo "(sin salida)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hapag-probe
          path: |
            probe-url.log
            hapag-url-probe.json
            hapag-url-HLBU2959982.txt
            hapag-url-FTAU1546275.txt
          if-no-files-found: ignore
