name: Verificar B/L (MSC + Maersk + Hapag)

# Valida `scripts/check_bl.py` contra las tres navieras con B/L reales.
#
# Por qué dos columnas: MSC y Maersk responden desde la IP del runner, pero
# Hapag-Lloyd bloquea por reputación de IP y necesita salir por WARP. Así se ve
# de un vistazo qué naviera necesita proxy y cuál no.

on:
  workflow_dispatch:
    inputs:
      proxy:
        description: "SOCKS5 de WARP para la columna 'warp'."
        required: false
        default: "socks5://127.0.0.1:40000"
        type: string

jobs:
  directo:
    name: Directo (sin proxy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Camoufox
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            camoufox-${{ runner.os }}-

      - name: Asegurar binario de Camoufox
        env:
          # Sin token, `camoufox fetch` choca con el rate limit de
          # api.github.com, que los runners comparten por IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ensure_camoufox.py

      - name: Consultar B/L
        env:
          BL_HAPAG: HLCUNG12607EKZE0
        run: |
          set -o pipefail
          python scripts/check_bl.py MEDUADP85690 275792562 "$BL_HAPAG" \
            2>&1 | tee check-directo.log || true

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Directo (IP del runner)"
            echo '```'
            grep -E "^(B/L|  RESULTADO|  puerto|  contenedores|  RESUMEN|  El primero|  Ninguno|  CONTENEDOR|  -{13})" \
              check-directo.log || echo "(sin líneas de resumen)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-directo
          path: |
            check-directo.log
            probe-dumps/
          if-no-files-found: ignore

  warp:
    name: WARP (socks5)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Camoufox
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            camoufox-${{ runner.os }}-

      - name: Asegurar binario de Camoufox
        env:
          # Sin token, `camoufox fetch` choca con el rate limit de
          # api.github.com, que los runners comparten por IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ensure_camoufox.py

      - name: Instalar Cloudflare WARP
        run: |
          set -euo pipefail
          # Marcas de tiempo por fase: `apt-get update -qq` es silencioso y sin
          # esto no se sabe si el tiempo se va en el update, en la descarga de
          # los .deb o en dpkg.
          t0=$(date +%s)
          mark() { echo "[tiempo] $1: $(( $(date +%s) - t0 ))s"; }
          # cloudflare-warp no está en los repos de Ubuntu: hay que añadir el
          # suyo, o `apt-get install cloudflare-warp` responde
          # "Unable to locate package".
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ ${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          mark "repo configurado"
          # Update completo: libtss2-tctildr0t64 vive en el pocket `security` y
          # un update restringido al repo de WARP lo deja sin candidato.
          sudo apt-get update -qq
          mark "apt-get update"
          # `--no-install-recommends` es la diferencia entre 15 min y ~1 min.
          # Sin él, apt instala las recomendaciones de WARP, que arrastran la
          # GUI (libwebkit2gtk-4.1-0, gstreamer completo, libayatana...) y suman
          # cientos de MB. Aquí solo se usan `warp-cli` y `warp-svc`: el
          # escritorio no hace falta.
          if ! sudo apt-get install -y -qq --no-install-recommends \
               -o Acquire::Retries=3 cloudflare-warp; then
            echo "::warning::cloudflare-warp no instaló a la primera; se inspecciona la dependencia."
            apt-cache policy libtss2-tctildr0t64 || true
            sudo apt-get install -y -qq --no-install-recommends libtss2-tctildr0t64 \
              || sudo apt-get install -y -qq --no-install-recommends libtss2-tctildr0t \
              || true
            sudo apt-get install -y -qq --no-install-recommends -f cloudflare-warp
          fi
          mark "apt-get install"
          warp-cli --version

      - name: Conectar WARP por SOCKS5
        run: |
          set -euo pipefail
          if ! sudo systemctl enable --now warp-svc 2>/dev/null; then
            sudo nohup warp-svc >/tmp/warp-svc.log 2>&1 &
          fi
          for i in $(seq 1 30); do
            warp-cli --accept-tos status >/dev/null 2>&1 && break
            sleep 1
          done
          if ! warp-cli --accept-tos registration show >/dev/null 2>&1; then
            warp-cli --accept-tos registration new
          fi
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in $(seq 1 40); do
            STATE="$(warp-cli --accept-tos status 2>/dev/null || echo unknown)"
            echo "warp: ${STATE}"
            case "$STATE" in *Connected*|*Proxy*) break ;; esac
            sleep 2
          done
          # Comprobar la salida real: si el SOCKS5 no responde, el navegador
          # falla al arrancar y el error sería engañoso.
          for i in $(seq 1 20); do
            if curl -s -m 5 --socks5 127.0.0.1:40000 https://api.ipify.org >/dev/null 2>&1; then
              echo "WARP listo tras ${i}s"
              break
            fi
            sleep 2
          done
          echo -n "IP de salida: "
          curl -s -m 10 --socks5 127.0.0.1:40000 https://api.ipify.org || echo "?"
          echo

      - name: Consultar B/L
        env:
          PROXY: ${{ github.event.inputs.proxy || 'socks5://127.0.0.1:40000' }}
          BL_HAPAG: HLCUNG12607EKZE0
        run: |
          set -o pipefail
          # Solo Hapag: es la única que necesita WARP. MSC y Maersk corren en el
          # job "directo" y meterlas aquí solo alargaba el job lento.
          python scripts/check_bl.py "$BL_HAPAG" \
            --proxy "$PROXY" 2>&1 | tee check-warp.log || true

      - name: Resumen
        if: always()
        run: |
          {
            echo "## WARP (socks5)"
            echo '```'
            grep -E "^(B/L|  RESULTADO|  puerto|  contenedores|  RESUMEN|  El primero|  Ninguno|  CONTENEDOR|  -{13})" \
              check-warp.log || echo "(sin líneas de resumen)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-warp
          path: |
            check-warp.log
            probe-dumps/
          if-no-files-found: ignore
