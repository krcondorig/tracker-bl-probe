name: Sonda Selenium + WARP (Hapag)

# TEMPORAL: responde una sola pregunta, ¿pasa Chrome de Selenium por Cloudflare
# en Hapag-Lloyd usando WARP como egreso? Se borra al decidir.
#
# Compara cuatro escenarios con la misma IP de egreso, para separar "la IP
# buena" de "la huella del navegador".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Selenium vs Cloudflare
    # ubuntu-latest ya es 26.04 y no provee libtss2-tctildr0t64: WARP no instala.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Ensure Chrome and Xvfb
        run: |
          set -euo pipefail
          # La imagen de ubuntu-24.04 ya trae Google Chrome. Se comprueba antes
          # de instalar: `google-chrome-stable` no está en los repos de Ubuntu.
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Chrome preinstalado: $(google-chrome --version)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends google-chrome-stable
            google-chrome --version
          fi
          # Headful necesita pantalla: xvfb se instala explícitamente porque no
          # está garantizado en la imagen.
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends xvfb
          fi
          echo "xvfb: $(xvfb-run --help >/dev/null 2>&1 && echo ok || echo missing)"

      - name: Cache WARP .deb packages
        uses: actions/cache@v4
        with:
          path: ~/.warp-debs
          key: warp-debs-${{ runner.os }}-v1

      - name: Install Cloudflare WARP
        run: |
          set -euo pipefail
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ ${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq

          CACHE_DEBS="$HOME/.warp-debs"
          mkdir -p "$CACHE_DEBS"
          if compgen -G "$CACHE_DEBS/*.deb" > /dev/null; then
            echo "Instalando $(ls -1 "$CACHE_DEBS"/*.deb | wc -l) .deb desde el cache"
            sudo dpkg -i "$CACHE_DEBS"/*.deb >/dev/null 2>&1 \
              || sudo apt-get install -y -qq --no-install-recommends -f || true
          fi

          if ! sudo apt-get install -y -qq --no-install-recommends \
               -o Acquire::Retries=3 cloudflare-warp; then
            echo "::warning::cloudflare-warp no instaló a la primera"
            apt-cache policy libtss2-tctildr0t64 || true
            sudo apt-get install -y -qq --no-install-recommends libtss2-tctildr0t64 \
              || sudo apt-get install -y -qq --no-install-recommends libtss2-tctildr0 \
              || true
            sudo apt-get install -y -qq --no-install-recommends -f cloudflare-warp
          fi

          if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
            cp -n /var/cache/apt/archives/*.deb "$CACHE_DEBS/" 2>/dev/null || true
          fi
          warp-cli --version

      - name: Connect WARP through SOCKS5 proxy
        run: |
          set -euo pipefail
          if ! sudo systemctl enable --now warp-svc 2>/dev/null; then
            sudo nohup warp-svc >/tmp/warp-svc.log 2>&1 &
          fi
          for i in $(seq 1 30); do
            if warp-cli --accept-tos status >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! warp-cli --accept-tos registration show >/dev/null 2>&1; then
            warp-cli --accept-tos registration new
          fi
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in $(seq 1 40); do
            STATE="$(warp-cli --accept-tos status 2>/dev/null || echo unknown)"
            echo "warp status: ${STATE}"
            case "$STATE" in
              *Connected*|*"Proxy"*) break ;;
            esac
            sleep 2
          done

      - name: Verify egress IP through proxy
        run: |
          set -euo pipefail
          DIRECT_IP="$(curl -s --max-time 15 https://api.ipify.org || echo unreachable)"
          PROXY_IP="$(curl -s --max-time 25 --socks5-hostname 127.0.0.1:40000 https://api.ipify.org || echo unreachable)"
          echo "IP directa del runner : ${DIRECT_IP}"
          echo "IP a través de WARP   : ${PROXY_IP}"
          {
            echo "### Salida de red"
            echo ""
            echo "| Ruta | IP |"
            echo "| --- | --- |"
            echo "| Runner | \`${DIRECT_IP}\` |"
            echo "| WARP SOCKS5 | \`${PROXY_IP}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${PROXY_IP}" = "unreachable" ]; then
            echo "::error::El proxy SOCKS5 no responde: la sonda no mediría nada."
            exit 1
          fi

      - name: Run probe
        run: |
          set -euo pipefail
          echo "Chrome: $(google-chrome --version || chromium --version || echo desconocido)"
          # Headful necesita pantalla; el runner no tiene, xvfb la simula.
          xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
            mvn -B -ntp -f probe-selenium/pom.xml \
            exec:java -Dexec.mainClass=probe.Probe \
            2>&1 | tee probe.log
        env:
          PROBE_PROXY: "socks5://127.0.0.1:40000"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Sonda Selenium + WARP"
            echo ""
            echo '```'
            sed -n '/VEREDICTO/,$p' probe.log || echo "sin veredicto"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-warp-probe
          path: probe.log
          if-no-files-found: ignore
